[project]
name = "vespatune"
version = "0.0.3"
description = "vespatune: no-code training for tabular models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache 2.0"}
authors = [
    {name = "Abhishek Thakur"}
]
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "rich>=14.2.0",
    "numpy>=2.4.1",
    "optuna>=4.7.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "joblib>=1.5.3",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.40.0",
    "xgboost>=3.1.3",
    "lightgbm>=4.6.0",
    "catboost>=1.2.8",
    "onnx>=1.20.1",
    "onnxmltools>=1.15.0",
    "onnxruntime>=1.23.2",
    "python-multipart>=0.0.21",
    "websockets>=16.0",
]

[project.optional-dependencies]
onnxruntime = ["onnxruntime>=1.23.2"]
dev = [
    "black==26.1.0",
    "isort==7.0.0",
    "flake8==7.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/vespaai-playground/vespatune"

[project.scripts]
vespatune = "vespatune.cli.vespatune:main"

[build-system]
requires = ["setuptools>=80.10.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vespatune = ["static/**/*", "templates/**/*"]

[tool.black]
line-length = 119
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.env
  | env
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119

[tool.flake8]
ignore = ["E203", "E501", "W503"]
max-line-length = 119
per-file-ignores = { "__init__.py" = ["F401", "E402"] }
exclude = [".git", ".venv", "__pycache__", "dist", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
